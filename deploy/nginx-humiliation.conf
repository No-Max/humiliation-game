# HTTP → HTTPS (домены с Let's Encrypt; сертификат ingame.by)
server {
  listen 80;
  listen [::]:80;
  server_name ingame.by www.ingame.by ingames.by www.ingames.by admin.ingame.by admin.ingames.by;
  return 301 https://$host$request_uri;
}

# Игра (HTTPS)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name ingame.by www.ingame.by ingames.by www.ingames.by;

  ssl_certificate /etc/letsencrypt/live/ingame.by/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ingame.by/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/humiliation-game/apps/web/dist;
  index index.html;

  location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3200/api/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    client_max_body_size 5m;
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:3200;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }
}

